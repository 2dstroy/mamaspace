<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mamaspace • For Moms & Babies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:'Segoe UI',system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#fff0f5,#e0f2fe,#f0f9ff);
      color:#4a2c4f;
      min-height:100vh;
      overflow-x:hidden;
    }
    .background-glow, .background-glow2{
      position:fixed; border-radius:50%; filter:blur(120px); opacity:0.15;
      z-index:-1; pointer-events:none;
    }
    .background-glow{ width:500px; height:500px; background:#ff8fab; top:-150px; right:-150px; }
    .background-glow2{ width:450px; height:450px; background:#7ed6ff; bottom:-150px; left:-150px; }

    .app{ display:flex; min-height:100vh; max-width:1600px; margin:auto; }
    .sidebar{ width:260px; padding:24px; border-right:1px solid rgba(255,105,180,0.15); background:rgba(255,255,255,0.85); backdrop-filter:blur(16px); display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100vh; }
    .logo{ font-size:30px; font-weight:800; background:linear-gradient(90deg,#ff8fab,#7ed6ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; display:flex; align-items:center; gap:10px; }
    .nav{ display:flex; flex-direction:column; gap:8px; }
    .nav-item{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:9999px; text-decoration:none; color:#6b4e71; font-weight:600; transition:0.3s; }
    .nav-item:hover, .nav-item.active{ background:rgba(255,143,171,0.15); color:#ff4d94; }
    .nav-item i{ font-size:20px; }
    .share-btn{ margin-top:auto; padding:15px; border:none; border-radius:9999px; background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; font-size:16px; font-weight:bold; cursor:pointer; }

    .right-sidebar{ width:280px; padding:24px; border-left:1px solid rgba(255,105,180,0.15); background:rgba(255,255,255,0.85); backdrop-filter:blur(16px); position:sticky; top:0; height:100vh; overflow-y:auto; }
    .articles-title{ font-size:22px; font-weight:700; color:#ff4d94; margin-bottom:20px; display:flex; align-items:center; gap:10px; }

    .main{ flex:1; padding:20px; overflow-y:auto; }
    .header{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); padding:15px 0; margin-bottom:20px; border-bottom:1px solid rgba(255,105,180,0.15); display:flex; align-items:center; justify-content:space-between; }
    .header h1{ color:#ff4d94; font-size:28px; }

    .avatar{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#ff8fab,#7ed6ff); display:flex; align-items:center; justify-content:center; font-size:24px; border:3px solid white; box-shadow:0 4px 10px rgba(255,143,171,0.3); }

    .compose{ background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px; padding:20px; margin-bottom:24px; box-shadow:0 4px 15px rgba(255,143,171,0.1); }
    .compose-top{ display:flex; gap:14px; }
    .compose-input{ width:100%; border:none; outline:none; resize:none; background:transparent; font-size:16px; color:#4a2c4f; min-height:90px; }
    .compose-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid #ffe4f0; }
    .compose-icons{ display:flex; gap:16px; color:#ff8fab; font-size:22px; cursor:pointer; }
    .post-btn{ border:none; padding:12px 32px; border-radius:9999px; background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; font-weight:bold; cursor:pointer; }

    .post{ background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px; padding:20px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
    .post-header{ display:flex; gap:12px; margin-bottom:12px; }
    .post-user{ font-weight:700; }
    .post-content{ line-height:1.6; font-size:16px; margin:14px 0; }
    .post-image{ width:100%; border-radius:18px; margin-top:12px; max-height:500px; object-fit:cover; }

    .post-footer{ margin-top:16px; padding-top:12px; border-top:1px solid #ffe4f0; display:flex; gap:20px; color:#ff4d94; font-size:15px; }
    .action-btn{ display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 12px; border-radius:9999px; transition:0.2s; }
    .action-btn:hover{ background:rgba(255,77,148,0.1); }

    .article-item { 
      padding:14px; background:#fff; border-radius:12px; margin-bottom:12px; 
      border-left:4px solid #ff8fab; box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }
    .comment-section { margin-top:12px; padding-top:12px; border-top:1px solid #ffe4f0; }
    .comment { padding:8px 0; font-size:14px; border-bottom:1px solid #f0f0f0; }
    .comment-input { display:flex; margin-top:8px; gap:8px; }
    .comment-input input { flex:1; padding:8px; border:1px solid #ddd; border-radius:9999px; }
  </style>
</head>
<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="app">
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="logo"><span>🍼</span> MAMASPACE</div>
      <div class="nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Explore</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>Mom Circle</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-baby"></i><span>Baby Milestones</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Archive</span></a>
      </div>
      <button class="share-btn"><i class="fa-solid fa-feather-pointed"></i> Share Moment</button>
    </div>

    <!-- MAIN FEED -->
    <div class="main">
      <div class="header">
        <h1>Home Feed</h1>
        <div style="display:flex; align-items:center; gap:12px;">
          <div id="userInfo" style="text-align:right; font-size:14px; color:#666;"></div>
          <div class="avatar">👩‍🍼</div>
        </div>
      </div>

      <!-- COMPOSE -->
      <div class="compose">
        <div class="compose-top">
          <div class="avatar">👩‍🍼</div>
          <textarea class="compose-input" placeholder="What's on your mind, mama? 💕"></textarea>
        </div>
        <div class="compose-actions">
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="compose-icons">
              <i id="imageIcon" class="fa-solid fa-image"></i>
              <i class="fa-solid fa-heart"></i>
              <i class="fa-solid fa-baby"></i>
            </div>
            <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:#ff4d94; cursor:pointer;">
              <input type="checkbox" id="isArticle"> Save as Article
            </label>
          </div>
          <button class="post-btn">Post to Mamaspace</button>
        </div>
      </div>

      <div id="postsContainer"></div>
    </div>

    <!-- RIGHT SIDEBAR - MY ARTICLES -->
    <div class="right-sidebar">
      <h2 class="articles-title">
        <i class="fa-solid fa-clock-rotate-left"></i> My Articles
      </h2>
      <div id="articlesContainer" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <!-- ====================== FIREBASE SCRIPT ====================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, 
      arrayUnion, increment, query, orderBy, serverTimestamp, getDoc, setDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJgFsx0Aq63bbQ7mwfOI6_0pSWJkO8zp8",
      authDomain: "mamaspace-bf004.firebaseapp.com",
      projectId: "mamaspace-bf004",
      storageBucket: "mamaspace-bf004.firebasestorage.app",
      messagingSenderId: "520083469560",
      appId: "1:520083469560:web:d83cec2ce32ba0fa1bf70d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let selectedFile = null;

    // DOM Elements
    const postBtn = document.querySelector(".post-btn");
    const textarea = document.querySelector(".compose-input");
    const postsContainer = document.getElementById("postsContainer");
    const articlesContainer = document.getElementById("articlesContainer");
    const imageIcon = document.getElementById("imageIcon");
    const userInfo = document.getElementById("userInfo");
    const isArticleCheckbox = document.getElementById("isArticle");

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";

    imageIcon.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) alert(`Selected: ${selectedFile.name}`);
    });

    // Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const username = user.email.split("@")[0];
        userInfo.innerHTML = `Welcome back, <b>@${username}</b>`;
      } else {
        alert("Please login first");
        window.location.href = "login.html";
      }
    });

    // Create Post
    postBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const text = textarea.value.trim();
      if (!text && !selectedFile) return alert("Write something or add a photo 💕");

      try {
        let imageUrl = "";
        if (selectedFile) {
          const storageRef = ref(storage, `posts/${Date.now()}_${selectedFile.name}`);
          await uploadBytes(storageRef, selectedFile);
          imageUrl = await getDownloadURL(storageRef);
        }

        const username = currentUser.email.split("@")[0];

        await addDoc(collection(db, "posts"), {
          user: username,
          username: `@${username}`,
          email: currentUser.email,
          avatar: "👩‍🍼",
          content: text,
          imageUrl: imageUrl,
          isArticle: isArticleCheckbox.checked,   // ← Added
          likes: 0,
          comments: [],
          createdAt: serverTimestamp()
        });

        textarea.value = "";
        selectedFile = null;
        fileInput.value = "";
        isArticleCheckbox.checked = false;
        alert("Posted successfully 💕");
      } catch (err) {
        console.error(err);
        alert("Failed to post");
      }
    });

    // Load Posts
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
      postsContainer.innerHTML = "";
      articlesContainer.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const postId = docSnap.id;

        const postHTML = `
          <div class="post">
            <div class="post-header">
              <div class="avatar">${post.avatar || "👩‍🍼"}</div>
              <div>
                <div class="post-user">${post.user}</div>
                <div style="color:#888;font-size:14px;">${post.username}</div>
              </div>
            </div>
            <div class="post-content">${post.content || ""}</div>
            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="post image">` : ""}
            
            <div class="post-footer">
              <div class="action-btn like-btn" data-id="${postId}">
                ❤️ <span class="like-count">${post.likes || 0}</span>
              </div>
              <div class="action-btn comment-btn" data-id="${postId}">
                💬 ${(post.comments || []).length}
              </div>
            </div>

            <div class="comment-section" id="comments-${postId}" style="display:none;">
              ${(post.comments || []).map(c => `<div class="comment">${c}</div>`).join("")}
              <div class="comment-input">
                <input type="text" placeholder="Write a comment..." class="comment-text">
                <button class="send-comment" data-id="${postId}">Send</button>
              </div>
            </div>
          </div>
        `;
        postsContainer.innerHTML += postHTML;

        // Show in Articles if marked as Article
        if (post.isArticle === true) {
          const articleHTML = `
            <div class="article-item">
              <p style="font-weight:600;">${post.content ? post.content.substring(0, 85) + "..." : ""}</p>
              <small style="color:#888;">Just now</small>
            </div>
          `;
          articlesContainer.innerHTML += articleHTML;
        }
      });
    });

    // Like + Comment
    postsContainer.addEventListener("click", async (e) => {
      if (!currentUser) return alert("Please login first!");

      if (e.target.closest(".like-btn")) {
        const likeBtn = e.target.closest(".like-btn");
        const postId = likeBtn.dataset.id;
        const postRef = doc(db, "posts", postId);
        const likeRef = doc(db, "posts", postId, "likes", currentUser.uid);

        try {
          const likeSnap = await getDoc(likeRef);
          if (likeSnap.exists()) {
            await deleteDoc(likeRef);
            await updateDoc(postRef, { likes: increment(-1) });
            likeBtn.style.color = "";
          } else {
            await setDoc(likeRef, { likedAt: Date.now() });
            await updateDoc(postRef, { likes: increment(1) });
            likeBtn.style.color = "red";
          }
        } catch (err) {
          console.error(err);
          alert("Like failed. Check Firebase Rules.");
        }
      }

      if (e.target.closest(".comment-btn")) {
        const btn = e.target.closest(".comment-btn");
        const section = document.getElementById(`comments-${btn.dataset.id}`);
        section.style.display = section.style.display === "block" ? "none" : "block";
      }

      if (e.target.closest(".send-comment")) {
        const btn = e.target.closest(".send-comment");
        const input = btn.previousElementSibling;
        const text = input.value.trim();
        if (!text) return;

        const postId = btn.dataset.id;
        const username = currentUser.email.split("@")[0];
        const postRef = doc(db, "posts", postId);

        try {
          await updateDoc(postRef, {
            comments: arrayUnion(`@${username}: ${text}`)
          });
          input.value = "";
        } catch (err) {
          console.error(err);
          alert("Failed to send comment");
        }
      }
    });
  </script>
</body>
</html>
