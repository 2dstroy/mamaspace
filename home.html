<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mamaspace • For Moms & Babies</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Segoe UI',system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#fff0f5,#e0f2fe,#f0f9ff);
      color:#4a2c4f;
      min-height:100vh;
      overflow-x:hidden;
    }

    .background-glow, .background-glow2{
      position:fixed;
      border-radius:50%;
      filter:blur(120px);
      opacity:0.15;
      z-index:-1;
      pointer-events:none;
    }

    .background-glow{ width:500px; height:500px; background:#ff8fab; top:-150px; right:-150px; }
    .background-glow2{ width:450px; height:450px; background:#7ed6ff; bottom:-150px; left:-150px; }

    .page-container{
      width:100%;
      max-width:1400px;
      margin:auto;
      min-height:100vh;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(16px);
    }

    .app{ display:flex; min-height:100vh; }

    /* SIDEBAR, MAIN, COMPOSE, POST styles remain the same */
    .sidebar{ width:260px; padding:24px; border-right:1px solid rgba(255,105,180,0.15); background:rgba(255,255,255,0.75); display:flex; flex-direction:column; gap:28px; }
    .logo{ font-size:30px; font-weight:800; background:linear-gradient(90deg,#ff8fab,#7ed6ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; display:flex; align-items:center; gap:10px; }
    .nav{ display:flex; flex-direction:column; gap:8px; }
    .nav-item{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:9999px; text-decoration:none; color:#6b4e71; font-weight:600; transition:0.3s; }
    .nav-item:hover, .nav-item.active{ background:rgba(255,143,171,0.15); color:#ff4d94; }
    .nav-item i{ font-size:20px; }
    .share-btn{ margin-top:auto; padding:15px; border:none; border-radius:9999px; background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s; }

    .main{ flex:1; padding:20px; overflow-y:auto; border-right:1px solid rgba(255,105,180,0.15); }
    .header{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); padding:15px 0; margin-bottom:20px; border-bottom:1px solid rgba(255,105,180,0.15); display:flex; align-items:center; justify-content:space-between; gap:15px; }
    .header h1{ color:#ff4d94; font-size:28px; }

    .avatar{
      width:48px; height:48px; border-radius:50%;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      display:flex; align-items:center; justify-content:center;
      font-size:24px; flex-shrink:0; border:3px solid white;
      box-shadow:0 4px 10px rgba(255,143,171,0.3);
    }

    .compose{
      background:white;
      border:1px solid rgba(255,143,171,0.2);
      border-radius:24px;
      padding:20px;
      margin-bottom:24px;
      box-shadow:0 4px 15px rgba(255,143,171,0.1);
    }

    .compose-top{ display:flex; gap:14px; }
    .compose-input{
      width:100%; border:none; outline:none; resize:none;
      background:transparent; font-size:16px; color:#4a2c4f;
      min-height:80px;
    }

    .compose-actions{
      display:flex; justify-content:space-between; align-items:center;
      margin-top:16px; padding-top:16px; border-top:1px solid #ffe4f0;
      flex-wrap:wrap; gap:12px;
    }

    .compose-icons{
      display:flex; gap:16px; color:#ff8fab; font-size:20px; cursor:pointer;
    }

    .post-btn{
      border:none; padding:12px 28px; border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      color:white; font-weight:bold; cursor:pointer;
    }

    .post{
      background:white;
      border:1px solid rgba(255,143,171,0.2);
      border-radius:24px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.05);
    }

    .post-header{ display:flex; gap:12px; margin-bottom:12px; }
    .post-user{ font-weight:700; }
    .post-content{ line-height:1.6; font-size:16px; margin:14px 0; }

    .post-image{
      width:100%;
      border-radius:18px;
      border:1px solid rgba(255,143,171,0.2);
      margin-top:10px;
    }

    .post-footer{ margin-top:12px; color:#ff8fab; font-weight:600; }

    /* Mobile Responsive */
    @media (max-width: 1024px){ .right-sidebar{ display:none; } .sidebar{ width:90px; align-items:center; } .logo{ font-size:0; } .logo span{ font-size:34px; } .nav-item{ justify-content:center; padding:16px; } .nav-item span{ display:none; } }
    @media (max-width: 768px){
      .app{ flex-direction:column; }
      .sidebar{ width:100%; flex-direction:row; overflow-x:auto; gap:10px; border-right:none; border-bottom:1px solid rgba(255,105,180,0.15); padding:14px; }
      .nav{ flex-direction:row; gap:10px; }
      .main{ border-right:none; padding:15px; }
      .header{ flex-direction:column; align-items:flex-start; }
      .search-box{ width:100%; }
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="page-container">
    <div class="app">

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="logo"><span>🍼</span> MAMASPACE</div>
        <div class="nav">
          <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Explore</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>Mom Circle</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-baby"></i><span>Baby Milestones</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-envelope"></i><span>Messages</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
        <button class="share-btn"><i class="fa-solid fa-feather-pointed"></i> Share Moment</button>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="header">
          <h1>Home Feed</h1>
          <div class="search-box">
            <input type="text" class="search-input" placeholder="Search mom tips...">
            <div class="avatar">👩‍🍼</div>
          </div>
        </div>

        <!-- COMPOSE -->
        <div class="compose">
          <div class="compose-top">
            <div class="avatar">👩‍🍼</div>
            <textarea class="compose-input" placeholder="What's on your mind, mama? 💕"></textarea>
          </div>

          <div class="compose-actions">
            <div class="compose-icons">
              <i id="image-upload-icon" class="fa-solid fa-image"></i>
              <i class="fa-solid fa-heart"></i>
              <i class="fa-solid fa-baby"></i>
            </div>
            <button class="post-btn">Post to Mamaspace</button>
          </div>
        </div>

        <!-- Posts Container -->
        <div id="posts-container"></div>
      </div>

      <!-- RIGHT SIDEBAR -->
      <div class="right-sidebar">
        <div class="widget">
          <h3>🌟 Trending</h3>
          <div class="trend-item">#SleepTraining</div>
          <div class="trend-item">#FirstFoods</div>
          <div class="trend-item">#MomGuiltIsReal</div>
        </div>
      </div>

    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc,
  onSnapshot 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import { 
  getStorage, 
  ref, 
  uploadBytes, 
  getDownloadURL 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBJgFsx0Aq63bbQ7mwfOI6_0pSWJkO8zp8",
  authDomain: "mamaspace-bf004.firebaseapp.com",
  projectId: "mamaspace-bf004",
  storageBucket: "mamaspace-bf004.firebasestorage.app",
  messagingSenderId: "520083469560",
  appId: "1:520083469560:web:d83cec2ce32ba0fa1bf70d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// UI Elements
const postBtn = document.querySelector(".post-btn");
const textarea = document.querySelector(".compose-input");
const postsContainer = document.getElementById("posts-container");
const imageIcon = document.getElementById("image-upload-icon");

let selectedFile = null;

// Create hidden file input
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "image/*";

imageIcon.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
  selectedFile = e.target.files[0];
  if (selectedFile) {
    alert(`Image selected: ${selectedFile.name}`);
  }
});

// Post Function
postBtn.addEventListener("click", async () => {
  const text = textarea.value.trim();

  if (!text && !selectedFile) {
    alert("Write something or add a photo 💕");
    return;
  }

  let imageUrl = "";

  try {
    // Upload image if selected
    if (selectedFile) {
      const storageRef = ref(storage, 'posts/' + Date.now() + '_' + selectedFile.name);
      await uploadBytes(storageRef, selectedFile);
      imageUrl = await getDownloadURL(storageRef);
    }

    // Save to Firestore
    await addDoc(collection(db, "posts"), {
      user: "Mama User",
      username: "@mama",
      avatar: "👩‍🍼",
      content: text || "",
      imageUrl: imageUrl,
      createdAt: Date.now()
    });

    textarea.value = "";
    selectedFile = null;
    alert("Posted successfully! 💕");

  } catch (err) {
    console.error(err);
    alert("Failed to post. Please try again.");
  }
});

// Realtime Posts
onSnapshot(collection(db, "posts"), (snapshot) => {
  postsContainer.innerHTML = "";

  snapshot.forEach((doc) => {
    const post = doc.data();

    postsContainer.innerHTML += `
      <div class="post">
        <div class="post-header">
          <div class="avatar">${post.avatar || "👩‍🍼"}</div>
          <div>
            <div class="post-user">${post.user || "User"}</div>
            <div style="color:#888;">${post.username || "@user"}</div>
          </div>
        </div>

        <div class="post-content">
          ${post.content}
        </div>

        ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="Post image">` : ''}

        <div class="post-footer">
          ❤️ 0 • 💬 0
        </div>
      </div>
    `;
  });
});
</script>
</body>
</html>
