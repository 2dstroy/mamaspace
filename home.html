<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mamaspace • For Moms & Babies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Segoe UI',system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#fff0f5,#e0f2fe,#f0f9ff);
      color:#4a2c4f;
      min-height:100vh;
      overflow-x:hidden;
    }

    .background-glow, .background-glow2{
      position:fixed; border-radius:50%; filter:blur(120px); opacity:0.15;
      z-index:-1; pointer-events:none;
    }
    .background-glow{ width:500px; height:500px; background:#ff8fab; top:-150px; right:-150px; }
    .background-glow2{ width:450px; height:450px; background:#7ed6ff; bottom:-150px; left:-150px; }

    .app{ display:flex; min-height:100vh; max-width:1400px; margin:auto; }

    /* SIDEBAR */
    .sidebar{ 
      width:260px; padding:24px; border-right:1px solid rgba(255,105,180,0.15);
      background:rgba(255,255,255,0.85); backdrop-filter:blur(16px);
      display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100vh;
    }
    .logo{ 
      font-size:30px; font-weight:800; 
      background:linear-gradient(90deg,#ff8fab,#7ed6ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; 
      display:flex; align-items:center; gap:10px; 
    }
    .nav{ display:flex; flex-direction:column; gap:8px; }
    .nav-item{ 
      display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:9999px;
      text-decoration:none; color:#6b4e71; font-weight:600; transition:0.3s; 
    }
    .nav-item:hover, .nav-item.active{ 
      background:rgba(255,143,171,0.15); color:#ff4d94; 
    }
    .nav-item i{ font-size:20px; }

    .share-btn{ 
      margin-top:auto; padding:15px; border:none; border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; 
      font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s; 
    }

    /* MAIN CONTENT */
    .main{ 
      flex:1; padding:20px; overflow-y:auto; 
    }
    .header{ 
      position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.95);
      backdrop-filter:blur(12px); padding:15px 0; margin-bottom:20px;
      border-bottom:1px solid rgba(255,105,180,0.15); 
      display:flex; align-items:center; justify-content:space-between; 
    }
    .header h1{ color:#ff4d94; font-size:28px; }

    .avatar{
      width:48px; height:48px; border-radius:50%; 
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      display:flex; align-items:center; justify-content:center; font-size:24px;
      border:3px solid white; box-shadow:0 4px 10px rgba(255,143,171,0.3);
    }

    /* Compose */
    .compose{ 
      background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px;
      padding:20px; margin-bottom:24px; box-shadow:0 4px 15px rgba(255,143,171,0.1); 
    }
    .compose-top{ display:flex; gap:14px; }
    .compose-input{ 
      width:100%; border:none; outline:none; resize:none; background:transparent;
      font-size:16px; color:#4a2c4f; min-height:90px; 
    }
    .compose-actions{ 
      display:flex; justify-content:space-between; align-items:center;
      margin-top:16px; padding-top:16px; border-top:1px solid #ffe4f0; 
    }
    .compose-icons{ display:flex; gap:16px; color:#ff8fab; font-size:22px; cursor:pointer; }
    .post-btn{ 
      border:none; padding:12px 32px; border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; 
      font-weight:bold; cursor:pointer; 
    }

    /* Posts */
    .post{
      background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px;
      padding:20px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,0.05);
    }
    .post-header{ display:flex; gap:12px; margin-bottom:12px; }
    .post-user{ font-weight:700; }
    .post-content{ line-height:1.6; font-size:16px; margin:14px 0; }
    .post-image{ width:100%; border-radius:18px; margin-top:12px; }

    .post-footer{
      margin-top:16px; padding-top:12px; border-top:1px solid #ffe4f0;
      display:flex; gap:20px; color:#ff4d94; font-size:15px;
    }
    .action-btn{
      display:flex; align-items:center; gap:6px; cursor:pointer; 
      padding:6px 12px; border-radius:9999px; transition:0.2s;
    }
    .action-btn:hover{ background:rgba(255,77,148,0.1); }

    .comment-section{
      margin-top:15px; padding-top:12px; border-top:1px solid #ffe4f0;
      display:none;
    }
    .comment{
      background:#fff0f5; padding:10px 14px; border-radius:12px; margin-bottom:8px; font-size:14.5px;
    }
    .comment-input{
      display:flex; gap:8px; margin-top:10px;
    }
    .comment-input input{
      flex:1; padding:10px 14px; border:1px solid #ffc2e0; border-radius:9999px; outline:none;
    }
    .comment-input button{
      border:none; background:#ff4d94; color:white; padding:10px 18px; border-radius:9999px; cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo"><span>🍼</span> MAMASPACE</div>
      <div class="nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Explore</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>Mom Circle</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-baby"></i><span>Baby Milestones</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-envelope"></i><span>Messages</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
      </div>
      <button class="share-btn"><i class="fa-solid fa-feather-pointed"></i> Share Moment</button>
    </div>

    <!-- MAIN FEED -->
    <div class="main">
      <div class="header">
        <h1>Home Feed</h1>
        <div style="display:flex; align-items:center; gap:12px;">
          <div id="userInfo" style="text-align:right; font-size:14px; color:#666;"></div>
          <div class="avatar">👩‍🍼</div>
        </div>
      </div>

      <!-- COMPOSE -->
      <div class="compose">
        <div class="compose-top">
          <div class="avatar">👩‍🍼</div>
          <textarea class="compose-input" placeholder="What's on your mind, mama? 💕"></textarea>
        </div>
        <div class="compose-actions">
          <div class="compose-icons">
            <i id="imageIcon" class="fa-solid fa-image"></i>
            <i class="fa-solid fa-heart"></i>
            <i class="fa-solid fa-baby"></i>
          </div>
          <button class="post-btn">Post to Mamaspace</button>
        </div>
      </div>

      <div id="postsContainer"></div>
    </div>
  </div>

<!-- Load JavaScript as Module -->
  <script type="module">
</body>
</html>
