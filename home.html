<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mamaspace • For Moms & Babies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Segoe UI',system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#fff0f5,#e0f2fe,#f0f9ff);
      color:#4a2c4f;
      min-height:100vh;
      overflow-x:hidden;
    }

    .background-glow, .background-glow2{
      position:fixed; border-radius:50%; filter:blur(120px); opacity:0.15;
      z-index:-1; pointer-events:none;
    }
    .background-glow{ width:500px; height:500px; background:#ff8fab; top:-150px; right:-150px; }
    .background-glow2{ width:450px; height:450px; background:#7ed6ff; bottom:-150px; left:-150px; }

    .page-container{
      width:100%; max-width:1400px; margin:auto; min-height:100vh;
      background:rgba(255,255,255,0.92); backdrop-filter:blur(16px);
    }

    .app{ display:flex; min-height:100vh; }

    .sidebar{ width:260px; padding:24px; border-right:1px solid rgba(255,105,180,0.15);
      background:rgba(255,255,255,0.75); display:flex; flex-direction:column; gap:28px; }
    .logo{ font-size:30px; font-weight:800; background:linear-gradient(90deg,#ff8fab,#7ed6ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; display:flex; align-items:center; gap:10px; }
    .nav{ display:flex; flex-direction:column; gap:8px; }
    .nav-item{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:9999px;
      text-decoration:none; color:#6b4e71; font-weight:600; transition:0.3s; }
    .nav-item:hover, .nav-item.active{ background:rgba(255,143,171,0.15); color:#ff4d94; }
    .nav-item i{ font-size:20px; }
    .share-btn{ margin-top:auto; padding:15px; border:none; border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; font-size:16px;
      font-weight:bold; cursor:pointer; transition:0.3s; }

    .main{ flex:1; padding:20px; overflow-y:auto; border-right:1px solid rgba(255,105,180,0.15); }
    .header{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.95);
      backdrop-filter:blur(12px); padding:15px 0; margin-bottom:20px;
      border-bottom:1px solid rgba(255,105,180,0.15); display:flex; align-items:center;
      justify-content:space-between; gap:15px; }
    .header h1{ color:#ff4d94; font-size:28px; }

    .avatar{
      width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      display:flex; align-items:center; justify-content:center; font-size:24px;
      flex-shrink:0; border:3px solid white; box-shadow:0 4px 10px rgba(255,143,171,0.3);
    }

    .compose{ background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px;
      padding:20px; margin-bottom:24px; box-shadow:0 4px 15px rgba(255,143,171,0.1); }
    .compose-top{ display:flex; gap:14px; }
    .compose-input{ width:100%; border:none; outline:none; resize:none; background:transparent;
      font-size:16px; color:#4a2c4f; min-height:80px; }
    .compose-actions{ display:flex; justify-content:space-between; align-items:center;
      margin-top:16px; padding-top:16px; border-top:1px solid #ffe4f0; flex-wrap:wrap; gap:12px; }
    .compose-icons{ display:flex; gap:16px; color:#ff8fab; font-size:20px; cursor:pointer; }
    .post-btn{ border:none; padding:12px 28px; border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff); color:white; font-weight:bold; cursor:pointer; }

    .post{
      background:white; border:1px solid rgba(255,143,171,0.2); border-radius:24px;
      padding:20px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,0.05);
    }
    .post-header{ display:flex; gap:12px; margin-bottom:12px; }
    .post-user{ font-weight:700; }
    .post-content{ line-height:1.6; font-size:16px; margin:14px 0; }
    .post-image{ width:100%; border-radius:18px; border:1px solid rgba(255,143,171,0.2); margin-top:10px; }

    /* Like & Comment Footer */
    .post-footer{
      margin-top:16px; padding-top:12px; border-top:1px solid #ffe4f0;
      display:flex; gap:20px; color:#ff4d94; font-size:15px;
    }
    .action-btn{
      display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 12px;
      border-radius:9999px; transition:0.2s;
    }
    .action-btn:hover{ background:rgba(255,77,148,0.1); }
    .action-btn.liked{ color:#ff4d94; }

    .comments-section{
      margin-top:12px; padding-top:12px; border-top:1px solid #ffe4f0;
      display:none;
    }
    .comment{
      display:flex; gap:10px; margin-bottom:10px; font-size:14px;
    }
    .comment-input{
      display:flex; gap:8px; margin-top:10px;
    }
    .comment-input input{
      flex:1; padding:10px 14px; border:1px solid #ffc2e0; border-radius:9999px;
      outline:none;
    }
  </style>
</head>
<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="page-container">
    <div class="app">

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="logo"><span>🍼</span> MAMASPACE</div>
        <div class="nav">
          <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Explore</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>Mom Circle</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-baby"></i><span>Baby Milestones</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
          <a href="#" class="nav-item"><i class="fa-solid fa-envelope"></i><span>Messages</span></a>
          <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
        <button class="share-btn"><i class="fa-solid fa-feather-pointed"></i> Share Moment</button>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="header">
          <h1>Home Feed</h1>
          <div style="display:flex; align-items:center; gap:12px;">
            <input type="text" placeholder="Search mom tips..." style="padding:10px 16px; border-radius:9999px; border:1px solid #ffc2e0; width:280px;">
            <div class="avatar">👩‍🍼</div>
          </div>
        </div>

        <!-- COMPOSE -->
        <div class="compose">
          <div class="compose-top">
            <div class="avatar">👩‍🍼</div>
            <textarea class="compose-input" placeholder="What's on your mind, mama? 💕"></textarea>
          </div>
          <div class="compose-actions">
            <div class="compose-icons">
              <i id="image-upload-icon" class="fa-solid fa-image"></i>
              <i class="fa-solid fa-heart"></i>
              <i class="fa-solid fa-baby"></i>
            </div>
            <button class="post-btn">Post to Mamaspace</button>
          </div>
        </div>

        <div id="posts-container"></div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, arrayUnion 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import { 
  getStorage, ref, uploadBytes, getDownloadURL 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJgFsx0Aq63bbQ7mwfOI6_0pSWJkO8zp8",
  authDomain: "mamaspace-bf004.firebaseapp.com",
  projectId: "mamaspace-bf004",
  storageBucket: "mamaspace-bf004.firebasestorage.app",
  messagingSenderId: "520083469560",
  appId: "1:520083469560:web:d83cec2ce32ba0fa1bf70d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const postBtn = document.querySelector(".post-btn");
const textarea = document.querySelector(".compose-input");
const postsContainer = document.getElementById("posts-container");
const imageIcon = document.getElementById("image-upload-icon");

let selectedFile = null;
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "image/*";

imageIcon.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
  selectedFile = e.target.files[0];
  if (selectedFile) alert(`Image selected: ${selectedFile.name}`);
});

// Post
postBtn.addEventListener("click", async () => {
  const text = textarea.value.trim();
  if (!text && !selectedFile) return alert("Write something or add a photo 💕");

  let imageUrl = "";
  try {
    if (selectedFile) {
      const storageRef = ref(storage, 'posts/' + Date.now() + '_' + selectedFile.name);
      await uploadBytes(storageRef, selectedFile);
      imageUrl = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db, "posts"), {
      user: "Mama User",
      username: "@mama",
      avatar: "👩‍🍼",
      content: text || "",
      imageUrl: imageUrl,
      likes: 0,
      comments: [],
      createdAt: Date.now()
    });

    textarea.value = "";
    selectedFile = null;
    alert("Posted successfully! 💕");
  } catch (err) {
    console.error(err);
    alert("Failed to post.");
  }
});

// Realtime Posts
onSnapshot(collection(db, "posts"), (snapshot) => {
  postsContainer.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const post = docSnap.data();
    const postId = docSnap.id;

    const postHTML = `
      <div class="post" data-id="${postId}">
        <div class="post-header">
          <div class="avatar">${post.avatar || "👩‍🍼"}</div>
          <div>
            <div class="post-user">${post.user || "Mama"}</div>
            <div style="color:#888;">${post.username || "@mama"}</div>
          </div>
        </div>

        <div class="post-content">${post.content}</div>
        ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="Post image">` : ''}

        <div class="post-footer">
          <div class="action-btn like-btn" data-id="${postId}">
            <i class="fa-solid fa-heart"></i> <span class="like-count">${post.likes || 0}</span>
          </div>
          <div class="action-btn comment-btn" data-id="${postId}">
            <i class="fa-solid fa-comment"></i> <span>${(post.comments || []).length}</span>
          </div>
        </div>

        <div class="comments-section" id="comments-${postId}">
          ${(post.comments || []).map(c => `
            <div class="comment">
              <strong>@mama:</strong> ${c}
            </div>
          `).join('')}

          <div class="comment-input">
            <input type="text" placeholder="Write a comment..." class="comment-input-field">
            <button class="post-comment-btn" data-id="${postId}">Send</button>
          </div>
        </div>
      </div>
    `;

    postsContainer.innerHTML += postHTML;
  });

  // Attach event listeners after rendering
  attachEventListeners();
});

function attachEventListeners() {
  // Like buttons
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.id;
      const postRef = doc(db, "posts", postId);

      try {
        await updateDoc(postRef, { likes: increment(1) }); // You can also use FieldValue.increment if imported
        // For simplicity we'll just refresh via snapshot
      } catch(e) { console.error(e); }
    });
  });

  // Comment toggle
  document.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.id;
      const commentsSection = document.getElementById(`comments-${postId}`);
      commentsSection.style.display = commentsSection.style.display === 'block' ? 'none' : 'block';
    });
  });

  // Post comment
  document.querySelectorAll('.post-comment-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.id;
      const input = btn.previousElementSibling;
      const text = input.value.trim();

      if (!text) return;

      const postRef = doc(db, "posts", postId);
      try {
        await updateDoc(postRef, {
          comments: arrayUnion(text)
        });
        input.value = "";
      } catch(e) {
        console.error(e);
      }
    });
  });
}

// Simple increment helper (since we didn't import FieldValue)
function increment(n) {
  // This is just a placeholder — better to use:
  // import { increment } from "firebase/firestore";
  // then: likes: increment(1)
  return (current) => (current || 0) + n;
}
</script>
    <script src="script.js"></script>
</body>
</html>
