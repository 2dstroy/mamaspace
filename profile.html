<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile • Mamaspace</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Segoe UI',system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,#fff0f5,#e0f2fe,#f0f9ff);
      color:#4a2c4f;
      min-height:100vh;
      overflow-x:hidden;
    }

    .background-glow,
    .background-glow2{
      position:fixed;
      border-radius:50%;
      filter:blur(120px);
      opacity:0.15;
      z-index:-1;
      pointer-events:none;
    }

    .background-glow{
      width:500px;
      height:500px;
      background:#ff8fab;
      top:-150px;
      right:-150px;
    }

    .background-glow2{
      width:450px;
      height:450px;
      background:#7ed6ff;
      bottom:-150px;
      left:-150px;
    }

    .page-container{
      width:100%;
      max-width:1400px;
      margin:auto;
      min-height:100vh;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(16px);
    }

    .app{
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      padding:24px;
      border-right:1px solid rgba(255,105,180,0.15);
      background:rgba(255,255,255,0.75);
      display:flex;
      flex-direction:column;
      gap:28px;
    }

    .logo{
      font-size:30px;
      font-weight:800;
      background:linear-gradient(90deg,#ff8fab,#7ed6ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 18px;
      border-radius:9999px;
      text-decoration:none;
      color:#6b4e71;
      font-weight:600;
      transition:0.3s;
    }

    .nav-item:hover,
    .nav-item.active{
      background:rgba(255,143,171,0.15);
      color:#ff4d94;
    }

    .nav-item i{
      font-size:20px;
    }

    .share-btn{
      margin-top:auto;
      padding:15px;
      border:none;
      border-radius:9999px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    /* MAIN */

    .main{
      flex:1;
      padding:20px;
      overflow-y:auto;
    }

    .header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(12px);
      padding:15px 0;
      margin-bottom:20px;
      border-bottom:1px solid rgba(255,105,180,0.15);
    }

    .header h1{
      color:#ff4d94;
      font-size:28px;
    }

    /* PROFILE HEADER */

    .profile-header{
      position:relative;
      height:260px;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      border-radius:24px;
      margin-bottom:90px;
      overflow:hidden;
    }

    .profile-avatar-container{
      position:absolute;
      bottom:-40px;
      left:30px;
      display:flex;
      align-items:flex-end;
      gap:20px;
      width:calc(100% - 60px);
    }

    .profile-avatar{
      width:150px;
      height:150px;
      border-radius:50%;
      background:linear-gradient(135deg,#ff8fab,#7ed6ff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:60px;
      border:6px solid white;
      box-shadow:0 8px 20px rgba(255,143,171,0.3);
      overflow:hidden;
      position:relative;
      flex-shrink:0;
      color:white;
    }

    .profile-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:14px;
      font-weight:600;
      opacity:0;
      transition:0.3s;
    }

    .profile-avatar:hover .overlay{
      opacity:1;
    }

    .profile-info{
      padding-bottom:20px;
    }

    .profile-name{
      font-size:28px;
      font-weight:800;
      color:white;
    }

    .profile-username{
      color:#fff;
      opacity:0.9;
      font-size:18px;
    }

    .profile-bio{
      margin:12px 0;
      line-height:1.5;
      max-width:700px;
      color:white;
    }

    .edit-btn{
      padding:10px 20px;
      font-size:14px;
      background:white;
      color:#ff4d94;
      border:none;
      border-radius:9999px;
      font-weight:bold;
      cursor:pointer;
    }

    /* STATS */

    .profile-stats{
      display:flex;
      gap:30px;
      margin:25px 0;
      flex-wrap:wrap;
    }

    .stat{
      text-align:center;
    }

    .stat-number{
      font-size:22px;
      font-weight:700;
      color:#ff4d94;
    }

    .stat-label{
      font-size:14px;
      color:#888;
    }

    /* POSTS */

    .post{
      background:white;
      border:1px solid rgba(255,143,171,0.2);
      border-radius:24px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.05);
    }

    .tab-bar{
      display:flex;
      gap:20px;
      border-bottom:2px solid #ffe4f0;
      margin-bottom:20px;
    }

    .tab{
      padding:12px 0;
      cursor:pointer;
      font-weight:600;
      color:#6b4e71;
    }

    .tab.active{
      color:#ff4d94;
      border-bottom:4px solid #ff4d94;
    }

    @media(max-width:768px){

      .sidebar{
        display:none;
      }

      .profile-avatar-container{
        flex-direction:column;
        align-items:flex-start;
      }

      .profile-name{
        font-size:22px;
      }

    }

  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="page-container">

    <div class="app">

      <!-- SIDEBAR -->

      <div class="sidebar">

        <div class="logo">
          <span>🍼</span> MAMASPACE
        </div>

        <div class="nav">

          <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>

          <a href="#" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Explore</span>
          </a>

          <a href="#" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Mom Circle</span>
          </a>

          <a href="#" class="nav-item">
            <i class="fa-solid fa-baby"></i>
            <span>Baby Milestones</span>
          </a>

          <a href="#" class="nav-item">
            <i class="fa-solid fa-bell"></i>
            <span>Notifications</span>
          </a>

          <a href="#" class="nav-item">
            <i class="fa-solid fa-envelope"></i>
            <span>Messages</span>
          </a>

          <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
          </a>

        </div>

        <button class="share-btn">
          <i class="fa-solid fa-feather-pointed"></i>
          Share Moment
        </button>

      </div>

      <!-- MAIN -->

      <div class="main">

        <div class="header">
          <h1>My Profile</h1>
        </div>

        <!-- PROFILE HEADER -->

        <div class="profile-header">

          <div class="profile-avatar-container">

            <div class="profile-avatar" id="profile-avatar">

              <img id="profileImage" src="" style="display:none;">

              <span id="profileEmoji">👤</span>

              <div class="overlay">
                <i class="fa-solid fa-camera"></i>
              </div>

            </div>

            <div class="profile-info">

              <div class="profile-name" id="profileName">
                Loading...
              </div>

              <div class="profile-username" id="profileUsername">
                @user
              </div>

              <div class="profile-bio" id="profileBio">
                Welcome to Mamaspace 💕
              </div>

              <button class="edit-btn">
                Edit Profile
              </button>

            </div>

          </div>

        </div>

        <!-- STATS -->

        <div class="profile-stats">

          <div class="stat">
            <div class="stat-number">0</div>
            <div class="stat-label">Posts</div>
          </div>

          <div class="stat">
            <div class="stat-number">0</div>
            <div class="stat-label">Followers</div>
          </div>

          <div class="stat">
            <div class="stat-number">0</div>
            <div class="stat-label">Following</div>
          </div>

        </div>

        <!-- TABS -->

        <div class="tab-bar">

          <div class="tab active">Posts</div>
          <div class="tab">Replies</div>
          <div class="tab">Media</div>
          <div class="tab">Likes</div>

        </div>

        <div id="user-posts"></div>

      </div>

    </div>

  </div>

 
</body>
</html>
