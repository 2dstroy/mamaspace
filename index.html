<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mamaspace • For Moms & Babies</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    .compose-box{
      background:#fff;
      padding:15px;
      border-radius:14px;
      box-shadow:0 5px 20px rgba(0,0,0,0.06);
      margin-bottom:20px;
    }

    .compose-input{
      width:100%;
      border:none;
      outline:none;
      resize:none;
      font-size:14px;
      min-height:80px;
      padding:10px;
      border-radius:10px;
      background:#f7f7f7;
    }

    .compose-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
    }

    .post-btn{
      background:#ff7aa2;
      color:#fff;
      border:none;
      padding:8px 14px;
      border-radius:10px;
      cursor:pointer;
    }

    .post{
      background:#fff;
      padding:15px;
      border-radius:14px;
      box-shadow:0 5px 15px rgba(0,0,0,0.05);
      margin-bottom:15px;
    }

    .post-header{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .avatar{
      width:35px;
      height:35px;
      border-radius:50%;
      background:#ffd6e7;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .post-content{
      margin-top:8px;
    }

    .post-image{
      width:100%;
      border-radius:10px;
      margin-top:10px;
    }

    .post-footer{
      display:flex;
      gap:20px;
      margin-top:10px;
      font-size:14px;
      color:#555;
    }

    .action-btn{
      cursor:pointer;
      user-select:none;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LEFT -->
  <div class="sidebar">
    <div class="logo">🍼 MAMASPACE</div>

    <div class="nav">
      <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
      <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Explore</a>
      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profile</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h1>Home Feed</h1>
      <div id="userInfo"></div>
    </div>

    <!-- COMPOSE BOX -->
    <div class="compose-box">
      <textarea id="postInput" class="compose-input" placeholder="Share your moment..."></textarea>

      <div class="compose-actions">
        <i id="imageIcon" class="fa-solid fa-image" style="cursor:pointer;font-size:18px;"></i>
        <button class="post-btn">Post</button>
      </div>
    </div>

    <!-- POSTS -->
    <div id="postsContainer">

      <!-- SAMPLE -->
      <div class="post">
        <div class="post-header">
          <div class="avatar">👩‍🍼</div>
          <div>
            <b>Maya Santos</b><br>
            <small>Just now</small>
          </div>
        </div>

        <div class="post-content">
          My baby finally slept through the night 😭💖
        </div>
      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="right-sidebar">
    <h3>My Articles</h3>
    <p><b>My Birth Story</b></p>
    <small>May 12, 2024</small>
  </div>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module" src="script/main.js"></script>

</body>
</html>
