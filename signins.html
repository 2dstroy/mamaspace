<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MamaSpace</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-container { width: 100%; max-width: 380px; padding: 2rem; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #ff69b4; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 0; }
    button:hover { background: #ff4da6; }
    .link { color: #ff69b4; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-container">
  <h1>👩‍🍼 MamaSpace</h1>
  <h2>Welcome Back</h2>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>

  <button id="loginBtn">Login</button>
  <button id="signupBtn" style="background:#ccc;">Create Account</button>

  <p><a href="#" class="link" id="forgotLink">Forgot Password?</a></p>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword,
    sendPasswordResetEmail 
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBJgFsx0Aq63bbQ7mwfOI6_0pSWJkO8zp8",
    authDomain: "mamaspace-bf004.firebaseapp.com",
    projectId: "mamaspace-bf004",
    storageBucket: "mamaspace-bf004.firebasestorage.app",
    messagingSenderId: "520083469560",
    appId: "1:520083469560:web:d83cec2ce32ba0fa1bf70d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ====================== LOGIN ======================
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) return alert("Please enter email and password");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "index.html"; // or wherever your main page is
    } catch (err) {
      console.error(err);
      alert("Login failed: " + err.message);
    }
  });

  // ====================== SIGN UP ======================
  document.getElementById("signupBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) return alert("Please enter email and password");
    if (password.length < 6) return alert("Password should be at least 6 characters");

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Account created successfully! 🎉");
      window.location.href = "index.html";
    } catch (err) {
      console.error(err);
      alert("Sign up failed: " + err.message);
    }
  });

  // ====================== FORGOT PASSWORD ======================
  document.getElementById("forgotLink").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();

    if (!email) return alert("Please enter your email first");

    try {
      await sendPasswordResetEmail(auth, email);
      alert("Password reset link sent to your email 💌");
    } catch (err) {
      alert("Error: " + err.message);
    }
  });

  // Optional: Allow pressing Enter to login
  document.getElementById("password").addEventListener("keypress", (e) => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });
</script>

</body>
</html>
