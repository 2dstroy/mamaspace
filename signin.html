
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MamaSpace</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }
    .login-container { 
      width: 100%; 
      max-width: 380px; 
      padding: 2rem; 
      text-align: center; 
    }
    input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 16px; 
    }
    button { 
      width: 100%; 
      padding: 14px; 
      background: #ff69b4; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer; 
      margin: 10px 0; 
    }
    button:hover { 
      background: #ff4da6; 
    }
    .signup-btn {
      background: #ccc !important;
    }
    .signup-btn:hover {
      background: #bbb !important;
    }
    .link { 
      color: #ff69b4; 
      text-decoration: none; 
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>👩‍🍼 MamaSpace</h1>
  <h2>Welcome Back</h2>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>

  <button id="loginBtn">Login</button>
  <button id="signupBtn" onclick="window.location.href='signup.html';">

  <p><a href="#" class="link" id="forgotLink">Forgot Password?</a></p>
</div>

<!-- Firebase SDKs + Main Script -->
<script type="module" src="script/login.js"></script>

</body>
</html>
