
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Back • Mamaspace</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

  <style>
    .gradient-bg{
      background: linear-gradient(135deg,#f8fafc 0%,#f3e8ff 100%);

<body class="gradient-bg min-h-screen flex items-center justify-center relative overflow-hidden">

  <div class="fixed inset-0 bg-[radial-gradient(circle_at_70%_80%,rgba(168,85,247,0.25),transparent)]"></div>

  <div class="relative z-10 max-w-md w-full px-6 py-12">

    <div class="bg-white rounded-3xl p-8 shadow-2xl">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex w-16 h-16 bg-purple-100 rounded-2xl items-center justify-center mb-4">
          <i class="fa-solid fa-baby text-4xl text-purple-500"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-900">
          Welcome Back Mama
        </h1>

        <p class="text-gray-600 mt-2">
          Sign in to continue your journey
        </p>
      </div>

      <!-- Message Box -->
      <div id="messageBox"
           class="hidden mb-4 p-4 rounded-2xl text-sm font-medium">
      </div>

      <!-- Sign In Form -->
      <form id="signinForm" class="space-y-6">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">

            placeholder="you@example.com"

        <!-- Password -->

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Password

          <div class="relative">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"

              class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-purple-500 transition-colors pr-12"

        </div>

        <!-- Forgot Password -->
        <div class="text-right">
          <button
            type="button"
            id="forgotPasswordBtn"
            class="text-pink-500 text-sm font-semibold hover:underline"
          >
            Forgot Password?
          </button>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-semibold py-4 rounded-2xl text-lg shadow-lg flex items-center justify-center gap-2 transition-all disabled:opacity-70"

          <i id="btnIcon" class="fa-solid fa-right-to-bracket"></i>

        </button>

        <!-- Signup -->

          Don’t have an account?

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Back • Mamaspace</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->

  <style>

  <div class="fixed inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(236,72,153,0.25),transparent)]"></div>
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_70%_80%,rgba(168,85,247,0.25),transparent)]"></div>

  <div class="relative z-10 max-w-md w-full px-6 py-12">

    <div class="bg-white rounded-3xl p-8 shadow-2xl">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex w-16 h-16 bg-purple-100 rounded-2xl items-center justify-center mb-4">
          <i class="fa-solid fa-baby text-4xl text-purple-500"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-900">
          Welcome Back Mama
        </h1>

        <p class="text-gray-600 mt-2">
          Sign in to continue your journey
        </p>
      </div>

      <!-- Message Box -->
      <div id="messageBox"
           class="hidden mb-4 p-4 rounded-2xl text-sm font-medium">
      </div>

      <!-- Sign In Form -->
      <form id="signinForm" class="space-y-6">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-purple-500 transition-colors"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>

          <div class="relative">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-purple-500 transition-colors pr-12"
            />

            <button
              type="button"
              id="togglePassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>
        </div>

        <!-- Forgot Password -->
        <div class="text-right">
          <button
            type="button"
            id="forgotPasswordBtn"
            class="text-pink-500 text-sm font-semibold hover:underline"
          >
            Forgot Password?
          </button>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-semibold py-4 rounded-2xl text-lg shadow-lg flex items-center justify-center gap-2 transition-all disabled:opacity-70"
        >

          <span id="btnText">Sign In</span>

          <i id="btnIcon" class="fa-solid fa-right-to-bracket"></i>

        </button>

        <!-- Signup -->
        <p class="text-center text-sm text-gray-600">
          Don’t have an account?

          <a
            href="signup.html"
            class="text-pink-500 font-semibold hover:underline"
          >
            Create one
          </a>
        </p>

      </form>

    </div>

  </div>

  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyBJgFsx0Aq63bbQ7mwfOI6_0pSWJkO8zp8",
      authDomain: "mamaspace-bf004.firebaseapp.com",
      projectId: "mamaspace-bf004",
      storageBucket: "mamaspace-bf004.firebasestorage.app",
      messagingSenderId: "520083469560",
      appId: "1:520083469560:web:d83cec2ce32ba0fa1bf70d",
      measurementId: "G-HFLW3BTN9E"
    };

    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // =========================
    // DOM ELEMENTS
    // =========================

    const form = document.getElementById("signinForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnIcon = document.getElementById("btnIcon");

    const togglePasswordBtn = document.getElementById("togglePassword");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");

    const messageBox = document.getElementById("messageBox");

    // =========================
    // SHOW MESSAGE FUNCTION
    // =========================

    function showMessage(message, type = "success") {

      messageBox.classList.remove("hidden");

      if(type === "success"){
        messageBox.className =
          "mb-4 p-4 rounded-2xl text-sm font-medium bg-green-100 text-green-700";
      } else {
        messageBox.className =
          "mb-4 p-4 rounded-2xl text-sm font-medium bg-red-100 text-red-700";
      }

      messageBox.textContent = message;
    }

    // =========================
    // TOGGLE PASSWORD
    // =========================

    togglePasswordBtn.addEventListener("click", () => {

      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";

      togglePasswordBtn.innerHTML = isPassword
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';

    });

    // =========================
    // SIGN IN
    // =========================

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if(!email || !password){
        showMessage("Please fill in all fields", "error");
        return;
      }

      // Loading State
      submitBtn.disabled = true;

      btnText.textContent = "Signing In...";

      btnIcon.classList.remove("fa-right-to-bracket");
      btnIcon.classList.add("fa-spinner", "fa-spin");

      try {

        const userCredential =
          await signInWithEmailAndPassword(auth, email, password);

        console.log("User signed in:", userCredential.user);

        showMessage("Login successful!");

        // Redirect
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);

      } catch(error){

        console.error(error.code);

        let errorMessage = "Login failed";

        switch(error.code){

          case "auth/user-not-found":
            errorMessage = "User not found";
            break;

          case "auth/wrong-password":
            errorMessage = "Wrong password";
            break;

          case "auth/invalid-email":
            errorMessage = "Invalid email address";
            break;

          case "auth/too-many-requests":
            errorMessage = "Too many attempts. Try again later.";
            break;

          case "auth/invalid-credential":
            errorMessage = "Invalid email or password";
            break;
        }

        showMessage(errorMessage, "error");

      } finally {

        submitBtn.disabled = false;

        btnText.textContent = "Sign In";

        btnIcon.classList.remove("fa-spinner", "fa-spin");
        btnIcon.classList.add("fa-right-to-bracket");

      }

    });

    // =========================
    // RESET PASSWORD
    // =========================

    forgotPasswordBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      if(!email){
        showMessage(
          "Please enter your email first",
          "error"
        );
        return;
      }

      try {

        await sendPasswordResetEmail(auth, email);

        showMessage(
          "Password reset email sent successfully!"
        );

      } catch(error){

        console.error(error.code);

        let errorMessage = "Failed to send reset email";

        switch(error.code){

          case "auth/user-not-found":
            errorMessage = "No user found with this email";
            break;

          case "auth/invalid-email":
            errorMessage = "Invalid email address";
            break;
        }

        showMessage(errorMessage, "error");

      }

    });

  </script>

</body>
